[input]
middle_click_paste = true
client_window_drag = false # ignores move requests from applications, false=use Mod+drag
# mod_right_double_click = "maximize"

[input.focus]
follows_mouse = true
hover_raises = false # Hover focuses only; clicks and keybinds raise.
# limits how far Umbriel may scroll a layout to reveal that window, measured in viewport widths.
follows_mouse_max_scroll = 0.0 # 0.0 allows only fully visible windows.

[input.keyboard]
numlock_toggle = true
repeat_rate = 25
repeat_delay = 600

# [input.mouse]
# accel_profile = "flat"   # omitted preserves the device's libinput default
# sensitivity = 0.0        # pointer speed -1.0 ~ 1.0
# natural_scroll = false

[input.cursor]
theme = "Bibata-Modern-Ice"
size = 24
hardware_cursor = true  # Set false to work around hardware cursor flicker or disappearance

[input.touchpad]
# enabled = true
tap = true
natural_scroll = true
left_handed = false
# accel_profile = "adaptive"
# sensitivity = 0.5
# scroll_factor = 1.5
# disable_while_typing = true
# disable_on_external_mouse = true

[input.tablet]
enabled = true                 # false disables the tablet and its pads
# map_to_output = "DP-1"       # confine the tablet area to one monitor
map_to_focused_output = true
map_to_focused_window = true  # pen area = focused window; wins over the output mappings
left_handed = true # flip 180°

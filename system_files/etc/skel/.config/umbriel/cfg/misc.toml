[general]
xwayland = true
xwayland_native_resolution = false # Sharp X11 apps and games on scaled outputs ; false/true=physical resolutions.
xwayland_xsettings = true # Announces the X11 interface scale and cursor theme through XSETTINGS.
xwayland_primary_output = "" # Select the monitor X11 games use as primary
mod_key = "Super"
show_cheatsheet = false
# focus_on_activate = false
# honor_restored_maximize = false
# Modal dialogs hang on their parent window and follow it. Turn this off to keep them ordinary windows.
# attach_modal_dialogs = false
# NVIDIA outputs without explicit synchronization wait for GPU rendering by default.
# nvidia_sync_workaround = true # Disable this workaround if it causes stuttering or frame drops.

[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"
SDL_VIDEODRIVER = "wayland"
QT_QPA_PLATFORM = "wayland"
QT_QPA_PLATFORMTHEME = "gtk3"
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"

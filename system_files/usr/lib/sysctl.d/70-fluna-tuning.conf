# Gaming-oriented kernel/VM tuning (from bazzite's 70-gaming.conf).
# Proton/Wine map large buffers, and split-lock detection adds overhead on
# some CPUs.
vm.max_map_count=2147483642
kernel.split_lock_mitigate=0

# Network: BBR + MTU probing help game traffic on lossy links.
net.ipv4.tcp_congestion_control=bbr
net.ipv4.tcp_mtu_probing=1

# Desktop: plenty of file watches for IDEs / game launchers.
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=8192

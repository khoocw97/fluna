---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './installer/**'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  # image-builder (osbuild) replaces bootc-image-builder
  IMAGE_BUILDER_IMAGE: "ghcr.io/osbuild/image-builder-cli:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build qcow2 image
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y podman

      - name: Free disk space
        if: inputs.platform != 'arm64'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build qcow2 image
        run: |
          set -euo pipefail
          ref="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          mkdir -p output
          sudo podman pull "$ref"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "${PWD}/disk_config/disk.toml:/blueprint.toml:ro" \
            -v "${PWD}/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${IMAGE_BUILDER_IMAGE}" \
            build qcow2 \
            --blueprint /blueprint.toml \
            --output-dir /output \
            --bootc-ref "$ref" \
            --bootc-default-fs btrfs
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Upload qcow2 image to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qcow2
          path: output
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy output S3:${{ secrets.S3_BUCKET_NAME }}

  installer:
    name: Build installer ISO (bootc-generic-iso)
    if: github.event_name != 'pull_request'  # amd64 only: installer Containerfile uses grub2-efi-x64
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build installer ISO
        run: |
          set -euo pipefail
          ref="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          mkdir -p output

          # 1. build the Anaconda installer environment container
          sudo podman build -t localhost/fluna-anaconda:latest \
            -f installer/Containerfile \
            --build-arg PAYLOAD_REF="$ref"

          # 2. embed the payload for offline installs
          sudo podman pull "$ref"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "${PWD}/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${IMAGE_BUILDER_IMAGE}" \
            build bootc-generic-iso \
            --output-dir /output \
            --bootc-ref localhost/fluna-anaconda:latest \
            --bootc-installer-payload-ref "$ref" \
            --bootc-default-fs btrfs
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Upload installer ISO to Job Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-iso
          path: output
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

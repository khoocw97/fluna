---
# Build a bootable live/installer ISO with titanoboa (ublue's live-ISO toolchain).
# This replaces the bootc-image-builder anaconda-iso path.
#
# Fully manual: workflow_dispatch only, no push/pull_request/schedule.
name: Build live ISO

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload the ISO to S3 instead of job artifacts"
        required: false
        default: false
        type: boolean

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build live ISO (amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri (GitHub usernames can be capitalized).
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The ubuntu-24.04 runner's rootful podman uses fuse-overlayfs, which
      # rejects the `.wh.` whiteouts written by the nested `podman pull` in
      # installer/src/build.sh. Pin native kernel overlayfs for the whole job
      # (both this build and titanoboa read the same root storage).
      - name: Use native kernel overlayfs for rootful podman
        run: |
          set -euo pipefail
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf
          sudo podman system reset -f 2>/dev/null || true
          sudo umount -R /var/lib/containers/storage /run/containers/storage 2>/dev/null || true
          sudo rm -rf /var/lib/containers/storage /run/containers/storage
          sudo podman info --format 'driver={{.Store.GraphDriverName}} options={{.Store.GraphOptions}}'
          if sudo podman info --format '{{.Store.GraphOptions}}' | grep -q mount_program; then
            echo "::error::rootful podman still uses a mount_program (fuse-overlayfs); native overlayfs pin failed"
            exit 1
          fi

      # titanoboa can't use the plain image (it lacks the live/installer layer).
      # Build the payload image from installer/ ON TOP of fluna, then feed THAT.
      # Privileged build: the payload build.sh runs dracut/podman/dnf scriptlets.
      # This also leaves the payload in local (root) podman storage, which is
      # where titanoboa reads its image from.
      - name: Build live-ISO payload
        run: |
          set -euo pipefail
          ref="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          sudo podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --squash \
            --build-arg BASE_IMAGE="${ref}" \
            --build-arg INSTALL_IMAGE="${ref}" \
            -t "localhost/${IMAGE_NAME}-payload:${DEFAULT_TAG}" \
            installer/

      # titanoboa runs plain `realpath` on iso-dest before creating it, which
      # errors when the path doesn't exist yet. Pre-create the dir + an empty
      # file so realpath resolves; the action then moves the built ISO over it.
      - name: Prepare ISO destination
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/output"
          : > "${{ github.workspace }}/output/${{ env.IMAGE_NAME }}-${{ env.DEFAULT_TAG }}-live-amd64.iso"

      - name: Build live ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main @ 2026-05-19 (#138)
        with:
          image-ref: localhost/${{ env.IMAGE_NAME }}-payload:${{ env.DEFAULT_TAG }}
          iso-dest: ${{ github.workspace }}/output/${{ env.IMAGE_NAME }}-${{ env.DEFAULT_TAG }}-live-amd64.iso

      - name: Stage ISO + checksum
        id: stage
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          UPLOAD_DIR="${{ github.workspace }}/upload"
          mkdir -p "${UPLOAD_DIR}"
          mv "${ISO_PATH}" "${UPLOAD_DIR}/"
          ISO_NAME="$(basename "${ISO_PATH}")"
          ( cd "${UPLOAD_DIR}" && sha256sum "${ISO_NAME}" | tee "${ISO_NAME}-CHECKSUM" )
          echo "upload-dir=${UPLOAD_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Upload ISO to job artifacts
        if: ${{ !inputs.upload-to-s3 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.IMAGE_NAME }}-live-iso
          path: ${{ steps.stage.outputs.upload-dir }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Upload ISO to S3
        if: ${{ inputs.upload-to-s3 }}
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.stage.outputs.upload-dir }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy "${SOURCE_DIR}" "S3:${{ secrets.S3_BUCKET_NAME }}/iso"
